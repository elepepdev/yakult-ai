name: Ruff
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.14"
      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.14"
          args: "format --check"
